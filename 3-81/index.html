<section class="stage">

<div class="mw"><div class="ml">M(S, v, w)</div><div class="m" id="B"></div></div><div>×</div><div class="mw"><div class="ml">M(T, u, v)</div><div class="m" id="A"></div></div><div>=</div><div class="mw"><div class="ml">M(ST, u, w)</div><div class="m" id="P"></div></div>

</section>

<script>
const S={
 en:{k:'Linear Algebra Done Right · 3.81',title:'Matrix of a product of linear maps',sub:'Pick a basis vector uₖ. The k-th column of M(T,u,v) is first converted by M(S,v,w); the result is exactly the k-th column of M(ST,u,w).',back:'← all visualizations',q:k=>`Follow what happens to u${k===0?'₁':'₂'}`,l1:k=>`column ${k+1} of M(T,u,v)`,l2:'apply M(S,v,w) to those v-coordinates',l3:k=>`column ${k+1} of M(ST,u,w)`,note:'This happens for every basis vector uₖ, so the two matrices have the same columns. That is why composition of linear maps becomes matrix multiplication.',rand:'randomize entries',reset:'reset',related:'Related: <a href="../3-51/index.html?lang={lang}">3.51 — what matrix multiplication does</a>.'},
 ru:{k:'Linear Algebra Done Right · 3.81',title:'Матрица произведения линейных отображений',sub:'Выбери базисный вектор uₖ. k-й столбец M(T,u,v) сначала преобразуется матрицей M(S,v,w); результат — ровно k-й столбец M(ST,u,w).',back:'← все визуализации',q:k=>`Проследи, что происходит с u${k===0?'₁':'₂'}`,l1:k=>`${k+1}-й столбец M(T,u,v)`,l2:'применяем M(S,v,w) к этим v-координатам',l3:k=>`${k+1}-й столбец M(ST,u,w)`,note:'Так происходит для каждого базисного вектора uₖ, поэтому у двух матриц совпадают все столбцы. Именно поэтому композиция линейных отображений превращается в умножение матриц.',rand:'случайные значения',reset:'сброс',related:'Связано: <a href="../3-51/index.html?lang={lang}">3.51 — что делает умножение матриц</a>.'}
};
let lang='en',sel=0;const D={A:[[1,2],[-1,3]],B:[[2,1],[1,-1]]};const $=i=>document.getElementById(i),AE=$('A'),BE=$('B'),PE=$('P');
function txt(k,...a){const v=S[lang][k];return typeof v==='function'?v(...a):v}
function makeInputs(el,data){el.innerHTML='';el.style.gridTemplateColumns=`repeat(${data[0].length},60px)`;data.forEach((r,i)=>r.forEach((v,j)=>{const x=document.createElement('input');x.className='cell';x.type='number';x.value=v;x.dataset.i=i;x.dataset.j=j;x.oninput=render;el.appendChild(x)}))}
function read(el){const a=[[0,0],[0,0]];[...el.children].forEach(x=>a[+x.dataset.i][+x.dataset.j]=Number(x.value||0));return a}
function mul(A,B){return A.map((r,i)=>B[0].map((_,j)=>r.reduce((s,__,k)=>s+A[i][k]*B[k][j],0)))}
function vec(v){return `<span class="vec">${v.map(n=>`<span>${n}</span>`).join('')}</span>`}
function out(P){PE.innerHTML='';PE.style.gridTemplateColumns='repeat(2,60px)';P.forEach((r,i)=>r.forEach((v,j)=>{const b=document.createElement('button');b.className='cell out'+(j===sel?' sel':'');b.textContent=v;b.onclick=()=>{sel=j;render()};PE.appendChild(b)}))}
function mark(){[...AE.children].forEach(x=>x.classList.toggle('sel',+x.dataset.j===sel));[...BE.children].forEach(x=>x.classList.remove('coef'))}
function render(){const A=read(AE),B=read(BE),P=mul(B,A);out(P);mark();const a=[A[0][sel],A[1][sel]],p=[P[0][sel],P[1][sel]];$('k').textContent=txt('k');$('title').textContent=txt('title');$('sub').textContent=txt('sub');$('back').textContent=txt('back');$('back').href=`../index.html?lang=${lang}`;$('q').innerHTML=txt('q',sel);$('l1').textContent=txt('l1',sel);$('l2').textContent=txt('l2');$('l3').textContent=txt('l3',sel);$('vA').innerHTML=`${vec(a)}<div style="margin-top:10px;color:var(--muted);font-size:13px">[T u<sub>${sel+1}</sub>]<sub>v</sub></div>`;$('calc').innerHTML=`<div style="font:400 20px Georgia,serif">M(S,v,w) ${vec(a)} = ${vec(p)}</div>`;$('vP').innerHTML=`${vec(p)}<div style="margin-top:10px;color:var(--muted);font-size:13px">[ST u<sub>${sel+1}</sub>]<sub>w</sub></div>`;$('eq').innerHTML=`(M(S,v,w)M(T,u,v))<sub>·,${sel+1}</sub> = M(ST,u,w)<sub>·,${sel+1}</sub>`;$('note').textContent=txt('note');$('rand').textContent=txt('rand');$('reset').textContent=txt('reset');$('related').innerHTML=txt('related').replace('{lang}',lang);$('u1').classList.toggle('active',sel===0);$('u2').classList.toggle('active',sel===1);$('en').classList.toggle('active',lang==='en');$('ru').classList.toggle('active',lang==='ru');document.documentElement.lang=lang}
function detect(){const q=new URLSearchParams(location.search).get('lang');if(q==='ru'||q==='en')lang=q;else if(navigator.language.toLowerCase().startsWith('ru'))lang='ru'}
$('u1').onclick=()=>{sel=0;render()};$('u2').onclick=()=>{sel=1;render()};$('en').onclick=()=>{lang='en';render()};$('ru').onclick=()=>{lang='ru';render()};$('rand').onclick=()=>{[...AE.children,...BE.children].forEach(x=>x.value=Math.floor(Math.random()*7)-3);render()};$('reset').onclick=()=>{makeInputs(AE,D.A);makeInputs(BE,D.B);sel=0;render()};detect();makeInputs(AE,D.A);makeInputs(BE,D.B);render();
</script>
