<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Axler Visualizations</title>
<style>
:root{--bg:#fbfaf7;--ink:#171717;--muted:#746f67;--line:#d8d2c7;--card:#fffdfa;--accent:#2f6feb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}main{max-width:1100px;margin:0 auto;padding:40px 16px 64px}header{display:grid;grid-template-columns:1fr auto;gap:20px;border-bottom:1px solid var(--line);padding-bottom:18px}h1{font:400 clamp(34px,5vw,64px)/1.03 Georgia,serif;margin:0}.k{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}p{line-height:1.58}.lang button{border:0;background:none;border-bottom:1px solid transparent;color:var(--muted);font:inherit;padding:4px 0 6px;cursor:pointer;margin-left:16px}.lang .active{color:var(--ink);border-color:var(--ink)}.sec{padding-top:34px}.st{font:400 26px Georgia,serif;margin:0 0 22px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px}.card{display:block;padding:22px;border:1px solid var(--line);border-radius:18px;background:var(--card);color:inherit;text-decoration:none;min-height:210px;transition:.15s}.card:hover{transform:translateY(-2px);border-color:#bcb4a6;box-shadow:0 10px 30px rgba(17,24,39,.05)}.top{display:flex;justify-content:space-between;gap:12px;margin-bottom:14px}.badge{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}.card h3{font:400 29px/1.08 Georgia,serif;margin:0 0 8px}.card p{margin:0;color:#54514b;font-size:15px}.foot{margin-top:18px;color:var(--accent);font-size:14px}@media(max-width:820px){header{grid-template-columns:1fr}.lang button{margin-left:0;margin-right:16px}}
</style>
</head>
<body><main><header><div><div class="k" id="k"></div><h1 id="title"></h1><p id="sub"></p></div><div class="lang"><button id="en" class="active">EN</button><button id="ru">RU</button></div></header><section class="sec"><h2 class="st" id="st"></h2><div class="grid">
<a class="card" id="c351"><div class="top"><div class="badge">3.51</div><div class="badge" id="ready351"></div></div><h3 id="t351"></h3><p id="d351"></p><div class="foot" id="f351"></div></a>
<a class="card" id="c381"><div class="top"><div class="badge">3.81</div><div class="badge" id="ready381"></div></div><h3 id="t381"></h3><p id="d381"></p><div class="foot" id="f381"></div></a>
<a class="card" id="c382"><div class="top"><div class="badge">3.82</div><div class="badge" id="ready382"></div></div><h3 id="t382"></h3><p id="d382"></p><div class="foot" id="f382"></div></a>
<a class="card" id="c384"><div class="top"><div class="badge">3.84</div><div class="badge" id="ready384"></div></div><h3 id="t384"></h3><p id="d384"></p><div class="foot" id="f384"></div></a>
</div></section></main>
<script>
const S={en:{k:'Axler companion · explorable notes',title:'Choose a visualization',sub:'Interactive visualizations for <i>Linear Algebra Done Right</i> — see how definitions, constructions, and proofs work.',st:'Available now',ready:'ready',t351:'Matrix multiplication as linear combinations',d351:'Interactive explanation of Axler 3.51: read the product <i>CR</i> by columns or by rows and see where each column or row comes from.',t381:'Matrix of a product of linear maps',d381:'Follow one basis vector through <i>T</i> and then <i>S</i> to see why composition becomes multiplication of coordinate matrices.',t382:'Identity operator between two bases',d382:'Keep the vector fixed while its coordinates are rewritten between two bases, and see why the two change-of-coordinate matrices are inverses.',t384:'Change-of-basis formula',d384:'Compare two coordinate routes for the same operator <i>T</i> and see directly why <i>A = C⁻¹BC</i>.',open:'Open visualization →'},ru:{k:'Axler companion · интерактивные заметки',title:'Выбери визуализацию',sub:'Интерактивные визуализации к <i>Linear Algebra Done Right</i> — чтобы увидеть, как работают определения, конструкции и доказательства.',st:'Доступно сейчас',ready:'готово',t351:'Умножение матриц как линейные комбинации',d351:'Интерактивное объяснение Axler 3.51: читай произведение <i>CR</i> по столбцам или строкам и смотри, откуда они берутся.',t381:'Матрица произведения линейных отображений',d381:'Проследи один базисный вектор через <i>T</i>, затем через <i>S</i> и увидь, почему композиция превращается в умножение координатных матриц.',t382:'Тождественный оператор в двух базисах',d382:'Сам вектор остаётся на месте, а его координаты переписываются между двумя базисами; видно, почему две матрицы смены координат взаимно обратны.',t384:'Формула смены базиса',d384:'Сравни два координатных пути для одного оператора <i>T</i> и увидь напрямую, почему <i>A = C⁻¹BC</i>.',open:'Открыть визуализацию →'}};
let lang='en';const $=i=>document.getElementById(i);function detect(){const q=new URLSearchParams(location.search).get('lang');if(q==='ru'||q==='en')lang=q;else if(navigator.language.toLowerCase().startsWith('ru'))lang='ru'}function render(){const s=S[lang];$('k').textContent=s.k;$('title').textContent=s.title;$('sub').innerHTML=s.sub;$('st').textContent=s.st;['351','381','382','384'].forEach(n=>{$('ready'+n).textContent=s.ready;$('t'+n).textContent=s['t'+n];$('d'+n).innerHTML=s['d'+n];$('f'+n).textContent=s.open;$('c'+n).href=`./3-${n.slice(1)}/index.html?lang=${lang}`});$('en').classList.toggle('active',lang==='en');$('ru').classList.toggle('active',lang==='ru');document.documentElement.lang=lang}$('en').onclick=()=>{lang='en';render()};$('ru').onclick=()=>{lang='ru';render()};detect();render();
</script></body></html>
