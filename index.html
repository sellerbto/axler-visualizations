<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Axler 3.51 — matrix multiplication, visually</title>
<style>
:root{
  --paper:#fbfaf7;
  --ink:#161616;
  --muted:#77736c;
  --rule:#d9d4ca;
  --blue:#2f6feb;
  --blue-soft:#eaf1ff;
  --orange:#c66a13;
  --orange-soft:#fff1df;
  --green:#2d7d46;
  --green-soft:#e8f5ec;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh}
main{width:min(1120px,calc(100% - 32px));margin:0 auto;padding:42px 0 64px}
header{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;padding-bottom:20px;border-bottom:1px solid var(--rule)}
h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(30px,4.4vw,58px);font-weight:500;line-height:1.04;letter-spacing:-.03em;margin:0}
.kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
header p{max-width:680px;margin:14px 0 0;color:#504d48;line-height:1.55;font-size:15px}
.mode{display:flex;gap:18px;align-items:center;white-space:nowrap}
.mode button{appearance:none;border:0;border-bottom:1px solid transparent;background:transparent;padding:4px 0 6px;font:inherit;color:var(--muted);cursor:pointer}
.mode button.active{color:var(--ink);border-color:var(--ink)}
.stage{padding:44px 0 30px}
.stage-grid{display:grid;grid-template-columns:auto 32px auto 32px auto;justify-content:center;align-items:center;gap:18px}
.op{font-family:Georgia,serif;font-size:31px;color:#777}
.matrix-wrap{display:grid;grid-template-rows:auto 1fr;gap:8px;justify-items:center}
.matrix-label{font-family:Georgia,serif;font-size:20px}
.matrix{position:relative;display:grid;gap:5px;padding:8px 13px}
.matrix::before,.matrix::after{content:"";position:absolute;top:0;bottom:0;width:8px;border-top:1.5px solid currentColor;border-bottom:1.5px solid currentColor}
.matrix::before{left:0;border-left:1.5px solid currentColor}.matrix::after{right:0;border-right:1.5px solid currentColor}
.cell{width:58px;height:42px;border:0;background:transparent;border-radius:4px;text-align:center;font:500 18px/1 Georgia,"Times New Roman",serif;color:var(--ink);padding:0;transition:background .18s,color .18s,transform .18s}
input.cell{outline:none;cursor:text}
input.cell:hover{background:#f1eee8}
input.cell:focus{background:white;box-shadow:inset 0 0 0 1px #b9b2a7}
.cell.pickable{cursor:pointer}
.cell.selected-col{background:var(--blue-soft);color:#1d4fb8}
.cell.selected-row{background:var(--orange-soft);color:#944a08}
.cell.coeff{background:var(--green-soft);color:#236637}
.hint{text-align:center;color:var(--muted);font-size:13px;margin-top:17px;min-height:20px}
.explainer{border-top:1px solid var(--rule);padding-top:30px;margin-top:12px}
.question{font-family:Georgia,serif;font-size:clamp(22px,3vw,34px);font-weight:400;line-height:1.25;margin:0 0 26px}
.process{display:grid;grid-template-columns:1fr 46px 1fr 46px 1fr;gap:14px;align-items:center}
.process-col{min-width:0}
.step-label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:12px}
.arrow{text-align:center;color:#9b968d;font-size:24px}
.coeff-list,.terms{display:grid;gap:10px}
.coeff-line{display:flex;align-items:center;gap:10px;min-height:46px;font-family:Georgia,serif;font-size:19px}
.coef-chip{display:inline-flex;width:42px;height:38px;align-items:center;justify-content:center;border-radius:5px;background:var(--green-soft);color:var(--green);font-family:Georgia,serif;font-size:19px}
.mini-vector{display:inline-grid;gap:2px;position:relative;padding:3px 10px;vertical-align:middle;color:var(--ink)}
.mini-vector::before,.mini-vector::after{content:"";position:absolute;top:0;bottom:0;width:6px;border-top:1.2px solid currentColor;border-bottom:1.2px solid currentColor}.mini-vector::before{left:0;border-left:1.2px solid currentColor}.mini-vector::after{right:0;border-right:1.2px solid currentColor}
.mini-vector span{font-family:Georgia,serif;font-size:18px;text-align:center;min-width:26px}
.row-vector{font-family:Georgia,serif;font-size:18px;white-space:nowrap}
.term{display:flex;align-items:center;gap:10px;min-height:46px;flex-wrap:wrap}
.term .times{font-family:Georgia,serif;font-size:18px;color:#666}
.result{display:flex;align-items:center;justify-content:flex-start;min-height:112px}
.identity{margin-top:26px;font-family:Georgia,"Times New Roman",serif;font-size:clamp(20px,2.5vw,28px);line-height:1.5}
.identity .blue{background:var(--blue-soft);padding:1px 5px;border-radius:3px;color:#1d4fb8}
.identity .orange{background:var(--orange-soft);padding:1px 5px;border-radius:3px;color:#944a08}
.identity .green{background:var(--green-soft);padding:1px 5px;border-radius:3px;color:#236637}
.note{margin-top:18px;max-width:760px;color:#514e49;line-height:1.55;font-size:14px}
.controls{display:flex;justify-content:flex-end;gap:14px;margin-top:26px}
.controls button{appearance:none;border:0;background:transparent;border-bottom:1px solid #aaa49a;color:#625f59;padding:3px 0;cursor:pointer;font:inherit;font-size:13px}
.controls button:hover{color:var(--ink);border-color:var(--ink)}
@media(max-width:820px){
  header{grid-template-columns:1fr}.mode{justify-self:start}
  .stage-grid{grid-template-columns:1fr;justify-items:center;gap:12px}.op{transform:rotate(90deg);font-size:22px}
  .process{grid-template-columns:1fr}.arrow{transform:rotate(90deg)}
  .process-col{padding:2px 0}.result{min-height:70px}
}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <div class="kicker">Linear Algebra Done Right · 3.51</div>
      <h1>What matrix multiplication is doing</h1>
      <p id="subtitle">A column of <i>CR</i> is not mysterious: it is a linear combination of the columns of <i>C</i>. The matching column of <i>R</i> contains the coefficients.</p>
    </div>
    <div class="mode" aria-label="view mode">
      <button id="columnsBtn" class="active">columns</button>
      <button id="rowsBtn">rows</button>
    </div>
  </header>

  <section class="stage">
    <div class="stage-grid">
      <div class="matrix-wrap"><div class="matrix-label">C</div><div id="C" class="matrix"></div></div>
      <div class="op">×</div>
      <div class="matrix-wrap"><div class="matrix-label">R</div><div id="R" class="matrix"></div></div>
      <div class="op">=</div>
      <div class="matrix-wrap"><div class="matrix-label">CR</div><div id="P" class="matrix"></div></div>
    </div>
    <div id="hint" class="hint"></div>
  </section>

  <section class="explainer">
    <h2 id="question" class="question"></h2>
    <div class="process">
      <div class="process-col">
        <div id="sourceLabel" class="step-label"></div>
        <div id="source" class="coeff-list"></div>
      </div>
      <div class="arrow">→</div>
      <div class="process-col">
        <div id="mixLabel" class="step-label"></div>
        <div id="mix" class="terms"></div>
      </div>
      <div class="arrow">→</div>
      <div class="process-col">
        <div id="resultLabel" class="step-label"></div>
        <div id="result" class="result"></div>
      </div>
    </div>
    <div id="identity" class="identity"></div>
    <div id="note" class="note"></div>
    <div class="controls"><button id="randomize">randomize entries</button><button id="reset">reset</button></div>
  </section>
</main>
<script>
const defaults={C:[[1,2],[3,4],[5,6]],R:[[2,-1,3],[4,5,1]]};
let mode='columns';let selected=1;
const $=id=>document.getElementById(id);
const CEl=$('C'),REl=$('R'),PEl=$('P');
function editableMatrix(el,data,name){el.innerHTML='';el.style.gridTemplateColumns=`repeat(${data[0].length},58px)`;data.forEach((row,i)=>row.forEach((v,j)=>{const x=document.createElement('input');x.className='cell';x.type='number';x.step='1';x.value=v;x.dataset.i=i;x.dataset.j=j;x.dataset.name=name;x.addEventListener('input',render);el.appendChild(x)}))}
function read(el,r,c){const a=Array.from({length:r},()=>Array(c).fill(0));[...el.children].forEach(x=>a[+x.dataset.i][+x.dataset.j]=Number(x.value||0));return a}
function mul(A,B){return A.map((row,i)=>B[0].map((_,j)=>row.reduce((s,_,k)=>s+A[i][k]*B[k][j],0)))}
function outputMatrix(el,A){el.innerHTML='';el.style.gridTemplateColumns=`repeat(${A[0].length},58px)`;A.forEach((row,i)=>row.forEach((v,j)=>{const d=document.createElement('button');d.className='cell pickable';d.textContent=v;d.dataset.i=i;d.dataset.j=j;d.addEventListener('click',()=>{selected=mode==='columns'?j:i;render()});el.appendChild(d)}))}
function vec(v){return `<span class="mini-vector">${v.map(n=>`<span>${n}</span>`).join('')}</span>`}
function row(v){return `<span class="row-vector">[&nbsp;${v.join('&nbsp;&nbsp;')}&nbsp;]</span>`}
function clearMarks(){[...CEl.children,...REl.children,...PEl.children].forEach(x=>x.classList.remove('selected-col','selected-row','coeff'))}
function mark(){clearMarks();if(mode==='columns'){
  [...REl.children].forEach(x=>{if(+x.dataset.j===selected)x.classList.add('coeff')});
  [...PEl.children].forEach(x=>{if(+x.dataset.j===selected)x.classList.add('selected-col')});
  [...REl.children].forEach(x=>x.onclick=()=>{selected=+x.dataset.j;render()});
}else{
  [...CEl.children].forEach(x=>{if(+x.dataset.i===selected)x.classList.add('coeff')});
  [...PEl.children].forEach(x=>{if(+x.dataset.i===selected)x.classList.add('selected-row')});
  [...CEl.children].forEach(x=>x.onclick=()=>{selected=+x.dataset.i;render()});
}}
function render(){
  const C=read(CEl,3,2),R=read(REl,2,3),P=mul(C,R);outputMatrix(PEl,P);mark();
  if(mode==='columns') renderColumns(C,R,P); else renderRows(C,R,P);
}
function renderColumns(C,R,P){
  $('subtitle').innerHTML='A column of <i>CR</i> is not mysterious: it is a linear combination of the columns of <i>C</i>. The matching column of <i>R</i> contains the coefficients.';
  $('hint').innerHTML='Click a column in <i>R</i> or <i>CR</i>. Edit any entry to see the decomposition update.';
  const k=selected,a=R[0][k],b=R[1][k],c1=C.map(r=>r[0]),c2=C.map(r=>r[1]),p=P.map(r=>r[k]);
  $('question').innerHTML=`Where does column ${k+1} of <i>CR</i> come from?`;
  $('sourceLabel').textContent=`column ${k+1} of R gives the coefficients`;
  $('source').innerHTML=`<div class="coeff-line"><span class="coef-chip">${a}</span><span>coefficient of column 1 of C</span></div><div class="coeff-line"><span class="coef-chip">${b}</span><span>coefficient of column 2 of C</span></div>`;
  $('mixLabel').textContent='use them to mix the columns of C';
  $('mix').innerHTML=`<div class="term"><span class="coef-chip">${a}</span><span class="times">×</span>${vec(c1)}</div><div class="term"><span class="coef-chip">${b}</span><span class="times">×</span>${vec(c2)}</div>`;
  $('resultLabel').textContent=`that produces column ${k+1} of CR`;$('result').innerHTML=vec(p);
  $('identity').innerHTML=`(CR)<sub>·,${k+1}</sub> = <span class="green">${a}</span>C<sub>·,1</sub> + <span class="green">${b}</span>C<sub>·,2</sub>`;
  $('note').innerHTML=`So every column of <i>CR</i> lies in span(C<sub>·,1</sub>, C<sub>·,2</sub>). In Axler’s notation, the coefficients are R<sub>1,${k+1}</sub>, R<sub>2,${k+1}</sub>.`;
}
function renderRows(C,R,P){
  $('subtitle').innerHTML='The same product can be read from the other direction: a row of <i>CR</i> is a linear combination of the rows of <i>R</i>. The matching row of <i>C</i> contains the coefficients.';
  $('hint').innerHTML='Click a row in <i>C</i> or <i>CR</i>. Edit any entry to see the decomposition update.';
  const j=selected,a=C[j][0],b=C[j][1],r1=R[0],r2=R[1],p=P[j];
  $('question').innerHTML=`Where does row ${j+1} of <i>CR</i> come from?`;
  $('sourceLabel').textContent=`row ${j+1} of C gives the coefficients`;
  $('source').innerHTML=`<div class="coeff-line"><span class="coef-chip">${a}</span><span>coefficient of row 1 of R</span></div><div class="coeff-line"><span class="coef-chip">${b}</span><span>coefficient of row 2 of R</span></div>`;
  $('mixLabel').textContent='use them to mix the rows of R';
  $('mix').innerHTML=`<div class="term"><span class="coef-chip">${a}</span><span class="times">×</span>${row(r1)}</div><div class="term"><span class="coef-chip">${b}</span><span class="times">×</span>${row(r2)}</div>`;
  $('resultLabel').textContent=`that produces row ${j+1} of CR`;$('result').innerHTML=row(p);
  $('identity').innerHTML=`(CR)<sub>${j+1},·</sub> = <span class="green">${a}</span>R<sub>1,·</sub> + <span class="green">${b}</span>R<sub>2,·</sub>`;
  $('note').innerHTML=`So every row of <i>CR</i> lies in span(R<sub>1,·</sub>, R<sub>2,·</sub>). In Axler’s notation, the coefficients are C<sub>${j+1},1</sub>, C<sub>${j+1},2</sub>.`;
}
function switchMode(next){mode=next;selected=next==='columns'?1:1;$('columnsBtn').classList.toggle('active',next==='columns');$('rowsBtn').classList.toggle('active',next==='rows');render()}
$('columnsBtn').onclick=()=>switchMode('columns');$('rowsBtn').onclick=()=>switchMode('rows');
$('randomize').onclick=()=>{const rnd=()=>Math.floor(Math.random()*9)-4;editableMatrix(CEl,Array.from({length:3},()=>Array.from({length:2},rnd)),'C');editableMatrix(REl,Array.from({length:2},()=>Array.from({length:3},rnd)),'R');render()};
$('reset').onclick=()=>{editableMatrix(CEl,defaults.C,'C');editableMatrix(REl,defaults.R,'R');mode='columns';selected=1;$('columnsBtn').classList.add('active');$('rowsBtn').classList.remove('active');render()};
editableMatrix(CEl,defaults.C,'C');editableMatrix(REl,defaults.R,'R');render();
</script>
</body>
</html>
