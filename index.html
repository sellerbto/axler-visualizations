<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Axler Visualizations</title><style>:root{--bg:#fbfaf7;--ink:#171717;--muted:#746f67;--line:#d8d2c7;--card:#fffdfa;--accent:#2f6feb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}main{max-width:1100px;margin:0 auto;padding:40px 16px 64px}header{display:grid;grid-template-columns:1fr auto;gap:20px;border-bottom:1px solid var(--line);padding-bottom:18px}h1{font:400 clamp(34px,5vw,64px)/1.03 Georgia,serif;margin:0}.k{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}p{line-height:1.58}.lang button{border:0;background:none;border-bottom:1px solid transparent;color:var(--muted);font:inherit;padding:4px 0 6px;cursor:pointer;margin-left:16px}.lang .active{color:var(--ink);border-color:var(--ink)}.sec{padding-top:34px}.st{font:400 26px Georgia,serif;margin:0 0 8px}.sn{color:#625f59;max-width:760px;font-size:14px;margin:0 0 22px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px}.card{display:block;padding:22px;border:1px solid var(--line);border-radius:18px;background:var(--card);color:inherit;text-decoration:none;min-height:210px;transition:.15s}.card:hover{transform:translateY(-2px);border-color:#bcb4a6;box-shadow:0 10px 30px rgba(17,24,39,.05)}.top{display:flex;justify-content:space-between;gap:12px;margin-bottom:14px}.badge{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}.card h3{font:400 29px/1.08 Georgia,serif;margin:0 0 8px}.card p{margin:0;color:#54514b;font-size:15px}.foot{margin-top:18px;color:var(--accent);font-size:14px}.coming{opacity:.64;pointer-events:none}.fn{margin-top:28px;color:var(--muted);font-size:13px}@media(max-width:820px){header{grid-template-columns:1fr}.lang button{margin-left:0;margin-right:16px}}</style></head><body><main><header><div><div class="k" id="k"></div><h1 id="title"></h1><p id="sub"></p></div><div class="lang"><button id="en" class="active">EN</button><button id="ru">RU</button></div></header><section class="sec"><h2 class="st" id="st"></h2><p class="sn" id="sn"></p><div class="grid"><a class="card" id="c351" href="./3-51/index.html?lang=en"><div class="top"><div class="badge">3.51</div><div class="badge" id="ready"></div></div><h3 id="t351"></h3><p id="d351"></p><div class="foot" id="f351"></div></a><div class="card coming"><div class="top"><div class="badge">Next</div><div class="badge" id="soon"></div></div><h3 id="tnext"></h3><p id="dnext"></p><div class="foot" id="fnext"></div></div></div><div class="fn" id="fn"></div></section></main><script>const S={en:{k:'Axler companion · explorable notes',title:'Choose a visualization',sub:'Interactive visualizations for <i>Linear Algebra Done Right</i> — see how definitions, constructions, and proofs work.',st:'Available now',sn:'Choose a topic and open the visualization. Every page is available in English and Russian.',ready:'ready',soon:'coming soon',t351:'Matrix multiplication as linear combinations',d351:'Interactive explanation of Axler 3.51: read the product <i>CR</i> by columns or by rows and see where each column or row comes from.',f351:'Open visualization →',tnext:'More visualizations',dnext:'Future entries can live here: differentiation on polynomial spaces, null space / range intuition, projections, change of basis, and more.',fnext:'The menu is ready for expansion.',fn:'New entries can be added as /topic/index.html and linked here.'},ru:{k:'Axler companion · интерактивные заметки',title:'Выбери визуализацию',sub:'Интерактивные визуализации к <i>Linear Algebra Done Right</i> — чтобы увидеть, как работают определения, конструкции и доказательства.',st:'Доступно сейчас',sn:'Выбирай тему и открывай визуализацию. Каждая страница доступна на русском и английском.',ready:'готово',soon:'скоро',t351:'Умножение матриц как линейные комбинации',d351:'Интерактивное объяснение Axler 3.51: читай произведение <i>CR</i> по столбцам или по строкам и смотри, откуда берётся каждый столбец или строка.',f351:'Открыть визуализацию →',tnext:'Следующие визуализации',dnext:'Сюда можно добавлять новые страницы: дифференцирование на пространствах многочленов, интуицию для null space / range, projections, change of basis и т.д.',fnext:'Меню уже готово к расширению.',fn:'Новые страницы можно добавлять как /topic/index.html и линковать отсюда.'}};let lang='en';const $=i=>document.getElementById(i);function detect(){const q=new URLSearchParams(location.search).get('lang');if(q==='ru'||q==='en')lang=q;else if(navigator.language.toLowerCase().startsWith('ru'))lang='ru'}function render(){const s=S[lang];$('k').textContent=s.k;$('title').textContent=s.title;$('sub').innerHTML=s.sub;$('st').textContent=s.st;$('sn').textContent=s.sn;$('ready').textContent=s.ready;$('soon').textContent=s.soon;$('t351').textContent=s.t351;$('d351').innerHTML=s.d351;$('f351').textContent=s.f351;$('tnext').textContent=s.tnext;$('dnext').textContent=s.dnext;$('fnext').textContent=s.fnext;$('fn').textContent=s.fn;$('c351').href=`./3-51/index.html?lang=${lang}`;$('en').classList.toggle('active',lang==='en');$('ru').classList.toggle('active',lang==='ru');document.documentElement.lang=lang}$('en').onclick=()=>{lang='en';render()};$('ru').onclick=()=>{lang='ru';render()};detect();render();</script></body></html>
