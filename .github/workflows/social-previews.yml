name: Generate social previews

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "*/index.html"
      - "social-previews.json"
      - "scripts/generate_social_previews.py"
      - ".github/workflows/social-previews.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: social-previews-main
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate preview images
        run: python scripts/generate_social_previews.py

      - name: Commit changed previews
        shell: bash
        run: |
          if git diff --quiet -- assets/social; then
            echo "Social previews are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/social
          git commit -m "Update generated social previews"
          git push origin HEAD:main
