const S={en:{k:'Linear Algebra Done Right · 3.82',title:'Identity operator between two bases',sub:'The identity operator does not move the vector. Its matrix can still be non-identity, because the coordinates are being rewritten in a different basis.',back:'← all visualizations',lu:'basis u — edit the two vectors',lv:'basis v — edit the two vectors',lx:'choose coordinates of x in basis u',warn:'Each pair must remain a basis (nonzero determinant).',q:'Same vector, different coordinate labels',l1:'u-coordinates of x',l2:'C = M(I,u,v) rewrites them as v-coordinates',l3:'D = M(I,v,u) rewrites them back',clabel:'C = M(I, u, v)',dlabel:'D = M(I, v, u)',note:'C and D undo each other because they only change the coordinate description of the same vector. Thus DC = CD = I.',preset:'rotate v basis',reset:'reset',related:'Proof ingredient: <a href="../3-81/index.html?lang={lang}">3.81 — matrix of a product of linear maps</a>.'},ru:{k:'Linear Algebra Done Right · 3.82',title:'Матрица тождественного оператора в двух базисах',sub:'Тождественный оператор не двигает сам вектор. Но его матрица может быть не единичной: меняется только запись координат в другом базисе.',back:'← все визуализации',lu:'базис u — меняй два вектора',lv:'базис v — меняй два вектора',lx:'выбери координаты x в базисе u',warn:'Обе пары должны оставаться базисами (определитель не равен нулю).',q:'Тот же вектор, другие координатные метки',l1:'u-координаты x',l2:'C = M(I,u,v) переписывает их в v-координатах',l3:'D = M(I,v,u) переписывает их обратно',clabel:'C = M(I, u, v)',dlabel:'D = M(I, v, u)',note:'C и D взаимно отменяют друг друга, потому что они только меняют координатное описание одного и того же вектора. Поэтому DC = CD = I.',preset:'повернуть базис v',reset:'сброс',related:'В доказательстве используется: <a href="../3-81/index.html?lang={lang}">3.81 — матрица произведения линейных отображений</a>.'}};
let lang='en',presetN=0;const $=i=>document.getElementById(i);const defaults={u11:1,u12:0,u21:0,u22:1,v11:1,v12:-1,v21:1,v22:1,x1:2,x2:1};
function txt(k){return S[lang][k]}function n(id){return Number($(id).value||0)}function fmt(x){if(Math.abs(x)<1e-10)x=0;const r=Math.round(x*100)/100;return Number.isInteger(r)?String(r):String(r)}
function matCols(a,b,c,d){return [[a,c],[b,d]]}function det(M){return M[0][0]*M[1][1]-M[0][1]*M[1][0]}function inv(M){const q=det(M);return [[M[1][1]/q,-M[0][1]/q],[-M[1][0]/q,M[0][0]/q]]}function mm(A,B){return A.map((r,i)=>B[0].map((_,j)=>r.reduce((s,__,k)=>s+A[i][k]*B[k][j],0)))}function mv(A,v){return A.map(r=>r[0]*v[0]+r[1]*v[1])}
function vec(v){return `<span class="vec"><span>${fmt(v[0])}</span><span>${fmt(v[1])}</span></span>`}function matrix(el,M){el.innerHTML='';el.style.gridTemplateColumns='repeat(2,70px)';M.forEach(r=>r.forEach(x=>{const s=document.createElement('span');s.className='mc';s.textContent=fmt(x);el.appendChild(s)}))}

function render(){const U=matCols(n('u11'),n('u12'),n('u21'),n('u22')),V=matCols(n('v11'),n('v12'),n('v21'),n('v22')),a=[n('x1'),n('x2')];$('k').textContent=txt('k');$('title').textContent=txt('title');$('sub').textContent=txt('sub');$('back').textContent=txt('back');$('back').href=`../index.html?lang=${lang}`;$('lu').textContent=txt('lu');$('lv').textContent=txt('lv');$('lx').textContent=txt('lx');$('q').textContent=txt('q');$('l1').textContent=txt('l1');$('l2').textContent=txt('l2');$('l3').textContent=txt('l3');$('clabel').textContent=txt('clabel');$('dlabel').textContent=txt('dlabel');$('note').textContent=txt('note');$('preset').textContent=txt('preset');$('reset').textContent=txt('reset');$('related').innerHTML=txt('related').replace('{lang}',lang);$('en').classList.toggle('active',lang==='en');$('ru').classList.toggle('active',lang==='ru');document.documentElement.lang=lang;const ok=Math.abs(det(U))>1e-7&&Math.abs(det(V))>1e-7;$('warn').textContent=ok?'':txt('warn');if(!ok){$('C').innerHTML='—';$('D').innerHTML='—';$('xu').innerHTML=vec(a);$('xv').textContent='—';$('xub').textContent='—';$('eq').textContent='';draw(U,V,[0,0]);return}const C=mm(inv(V),U),D=mm(inv(U),V),b=mv(C,a),back=mv(D,b),p=mv(U,a);matrix($('C'),C);matrix($('D'),D);$('xu').innerHTML=vec(a);$('xv').innerHTML=vec(b);$('xub').innerHTML=vec(back);$('eq').innerHTML='D C = C D = I';draw(U,V,p)}
function detect(){const q=new URLSearchParams(location.search).get('lang');if(q==='ru'||q==='en')lang=q;else if(navigator.language.toLowerCase().startsWith('ru'))lang='ru'}function reset(){Object.entries(defaults).forEach(([k,v])=>$(k).value=v);presetN=0;render()}function preset(){presetN=(presetN+1)%3;const sets=[[[1,1],[-1,1]],[[2,1],[-1,1]],[[1,2],[-1,1]]],s=sets[presetN];$('v11').value=s[0][0];$('v12').value=s[0][1];$('v21').value=s[1][0];$('v22').value=s[1][1];render()}
['u11','u12','u21','u22','v11','v12','v21','v22','x1','x2'].forEach(id=>$(id).oninput=render);$('en').onclick=()=>{lang='en';render()};$('ru').onclick=()=>{lang='ru';render()};$('reset').onclick=reset;$('preset').onclick=preset;detect();reset();
