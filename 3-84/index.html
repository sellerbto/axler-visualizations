<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Axler 3.84</title>
<style>
:root{--bg:#fbfaf7;--ink:#171717;--muted:#746f67;--line:#d8d2c7;--paper:#fffdfa;--blue:#e9f1ff;--orange:#fff0de;--green:#e8f4ea;--accent:#2f6feb;--bad:#a33a2b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}main{max-width:1120px;margin:0 auto;padding:36px 16px 64px}header{display:grid;grid-template-columns:1fr auto;gap:20px;border-bottom:1px solid var(--line);padding-bottom:18px}h1{font:400 clamp(30px,4vw,54px)/1.06 Georgia,serif;margin:0}.k{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}p{line-height:1.55}.top{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}.top a,.top button,.controls button{border:0;background:none;border-bottom:1px solid transparent;color:var(--muted);font:inherit;padding:4px 0 6px;text-decoration:none;cursor:pointer}.top a:hover,.top button:hover,.top .active,.controls button:hover{color:var(--ink);border-color:var(--ink)}
.edit{padding:28px 0 22px;display:grid;grid-template-columns:repeat(4,1fr);gap:22px}.group{border-top:1px solid var(--line);padding-top:14px}.lab{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}.rows{display:grid;gap:7px}.pair{display:flex;gap:6px}.pair input{width:64px;height:38px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:center;font:500 17px Georgia,serif}.pair input:focus{outline:none;border-color:var(--ink);background:#fff}.warn{grid-column:1/-1;color:var(--bad);font-size:14px;min-height:18px}.diagram{border-top:1px solid var(--line);padding-top:28px}.q{font:400 clamp(23px,3vw,34px)/1.25 Georgia,serif;margin:0 0 24px}.path{display:grid;grid-template-columns:1fr 52px 1fr 52px 1fr 52px 1fr;gap:8px;align-items:center}.node{text-align:center;min-height:118px;display:grid;place-items:center;align-content:center;gap:8px}.node small{color:var(--muted);line-height:1.35}.arrow{text-align:center}.arrow .sym{font-size:24px;color:#9a948b}.arrow .name{font:400 18px Georgia,serif;margin-top:4px}.vec{display:inline-grid;gap:3px;position:relative;padding:3px 12px;min-width:58px}.vec:before,.vec:after{content:"";position:absolute;top:0;bottom:0;width:6px;border-top:1.2px solid currentColor;border-bottom:1.2px solid currentColor}.vec:before{left:0;border-left:1.2px solid currentColor}.vec:after{right:0;border-right:1.2px solid currentColor}.vec span{font:400 20px Georgia,serif;text-align:center}.direct{margin:10px auto 0;max-width:560px;display:grid;grid-template-columns:1fr 160px 1fr;align-items:center;text-align:center}.direct .bar{position:relative;border-top:1px solid var(--ink);margin:0 12px}.direct .bar:after{content:'›';position:absolute;right:-2px;top:-16px;font-size:25px}.direct .bar span{position:absolute;left:50%;transform:translateX(-50%);top:-28px;background:var(--bg);padding:0 8px;font:400 18px Georgia,serif}.matsec{margin-top:34px;border-top:1px solid var(--line);padding-top:26px}.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}.mwrap{display:grid;gap:8px;justify-items:center;text-align:center}.mwrap .desc{color:var(--muted);font-size:13px}.m{position:relative;display:grid;gap:4px;padding:7px 12px}.m:before,.m:after{content:"";position:absolute;top:0;bottom:0;width:7px;border-top:1.2px solid currentColor;border-bottom:1.2px solid currentColor}.m:before{left:0;border-left:1.2px solid currentColor}.m:after{right:0;border-right:1.2px solid currentColor}.mc{width:66px;text-align:center;font:400 18px Georgia,serif}.identity{margin-top:28px;text-align:center;font:400 clamp(25px,3.4vw,40px)/1.3 Georgia,serif}.identity .c{background:var(--green);border-radius:5px;padding:2px 8px}.note{max-width:820px;margin:12px auto 0;color:#514d47;text-align:center}.ingredients{margin-top:26px;padding-top:18px;border-top:1px solid var(--line);display:flex;justify-content:center;gap:22px;flex-wrap:wrap;font-size:14px}.ingredients span{color:var(--muted)}.ingredients a{color:var(--accent);text-decoration:none}.ingredients a:hover{text-decoration:underline}.controls{display:flex;justify-content:flex-end;gap:16px;margin-top:20px}
@media(max-width:900px){header{grid-template-columns:1fr}.edit,.mgrid{grid-template-columns:1fr 1fr}.path{grid-template-columns:1fr}.arrow .sym{transform:rotate(90deg);display:inline-block}.direct{grid-template-columns:1fr;gap:30px}.direct .bar{width:160px;margin:auto}.warn{grid-column:1/-1}}@media(max-width:560px){.edit,.mgrid{grid-template-columns:1fr}}
</style>
</head>
<body><main>
<header><div><div class="k" id="k"></div><h1 id="title"></h1><p id="sub"></p></div><div class="top"><a id="back"></a><button id="en" class="active">EN</button><button id="ru">RU</button></div></header>
<section class="edit">
<div class="group"><div class="lab" id="lt"></div><div class="rows"><div class="pair"><input id="t11" type="number" step="0.25"><input id="t12" type="number" step="0.25"></div><div class="pair"><input id="t21" type="number" step="0.25"><input id="t22" type="number" step="0.25"></div></div></div>
<div class="group"><div class="lab" id="lu"></div><div class="rows"><div class="pair"><input id="u11" type="number" step="0.25"><input id="u21" type="number" step="0.25"></div><div class="pair"><input id="u12" type="number" step="0.25"><input id="u22" type="number" step="0.25"></div></div></div>
<div class="group"><div class="lab" id="lv"></div><div class="rows"><div class="pair"><input id="v11" type="number" step="0.25"><input id="v21" type="number" step="0.25"></div><div class="pair"><input id="v12" type="number" step="0.25"><input id="v22" type="number" step="0.25"></div></div></div>
<div class="group"><div class="lab" id="lx"></div><div class="rows"><div class="pair"><input id="x1" type="number" step="0.25"><input id="x2" type="number" step="0.25"></div></div></div><div class="warn" id="warn"></div>
</section>
<section class="diagram"><h2 class="q" id="q"></h2><div class="path"><div class="node"><div id="n1"></div><small id="s1"></small></div><div class="arrow"><div class="sym">→</div><div class="name">C</div></div><div class="node"><div id="n2"></div><small id="s2"></small></div><div class="arrow"><div class="sym">→</div><div class="name">B</div></div><div class="node"><div id="n3"></div><small id="s3"></small></div><div class="arrow"><div class="sym">→</div><div class="name">C⁻¹</div></div><div class="node"><div id="n4"></div><small id="s4"></small></div></div><div class="direct"><div id="dn1"></div><div class="bar"><span>A</span></div><div id="dn2"></div></div></section>
<section class="matsec"><div class="mgrid"><div class="mwrap"><div>A = M(T,u)</div><div class="m" id="A"></div><div class="desc" id="da"></div></div><div class="mwrap"><div>B = M(T,v)</div><div class="m" id="B"></div><div class="desc" id="db"></div></div><div class="mwrap"><div>C = M(I,u,v)</div><div class="m" id="C"></div><div class="desc" id="dc"></div></div><div class="mwrap"><div>C⁻¹ = M(I,v,u)</div><div class="m" id="Ci"></div><div class="desc" id="dci"></div></div></div><div class="identity">A = <span class="c">C⁻¹</span> B <span class="c">C</span></div><div class="note" id="note"></div><div class="ingredients"><span id="uses"></span><a id="l381"></a><a id="l382"></a></div><div class="controls"><button id="preset"></button><button id="reset"></button></div></section>
</main>
<script>
const S={en:{k:'Linear Algebra Done Right · 3.84',title:'Change-of-basis formula',sub:'The operator T is fixed. Only the coordinate language changes. Compare the direct u-coordinate route with the route that changes to v-coordinates, applies B, and changes back.',back:'← all visualizations',lt:'one fixed operator T (ambient coordinates)',lu:'basis u as columns',lv:'basis v as columns',lx:'start with [x]u',warn:'u and v must remain bases (nonzero determinant).',q:'Two coordinate routes for the same vector Tx',s1:'start: [x]u',s2:'same x, now [x]v',s3:'apply T in v-coordinates: [Tx]v',s4:'same Tx, back in u-coordinates',da:'direct u-coordinate description of T',db:'v-coordinate description of the same T',dc:'rewrite u-coordinates as v-coordinates',dci:'rewrite v-coordinates as u-coordinates',note:'Both routes start with [x]u and end with [Tx]u for every x. Therefore the matrix of the long route C⁻¹BC must equal the matrix A of the direct route.',uses:'Proof ingredients:',l381:'3.81 — matrix of a product',l382:'3.82 — inverse change-of-coordinate matrices',preset:'change basis v',reset:'reset'},ru:{k:'Linear Algebra Done Right · 3.84',title:'Формула смены базиса',sub:'Оператор T остаётся тем же. Меняется только язык координат. Сравни прямой путь в u-координатах с путём: перейти в v-координаты, применить B и вернуться обратно.',back:'← все визуализации',lt:'один фиксированный оператор T (внешние координаты)',lu:'базис u записан столбцами',lv:'базис v записан столбцами',lx:'начни с [x]u',warn:'u и v должны оставаться базисами (определитель не равен нулю).',q:'Два координатных пути к одному и тому же вектору Tx',s1:'старт: [x]u',s2:'тот же x, теперь [x]v',s3:'применяем T в v-координатах: [Tx]v',s4:'тот же Tx, возвращаемся в u-координаты',da:'прямое описание T в u-координатах',db:'описание того же T в v-координатах',dc:'переписывает u-координаты в v-координатах',dci:'переписывает v-координаты в u-координатах',note:'Оба пути для любого x начинаются с [x]u и заканчиваются [Tx]u. Поэтому матрица длинного пути C⁻¹BC обязана совпадать с матрицей A прямого пути.',uses:'В доказательстве используются:',l381:'3.81 — матрица произведения',l382:'3.82 — обратные матрицы смены координат',preset:'сменить базис v',reset:'сброс'}};
let lang='en',presetN=0;const $=i=>document.getElementById(i);const defaults={t11:2,t12:1,t21:-1,t22:1,u11:1,u21:0,u12:0,u22:1,v11:1,v21:1,v12:-1,v22:1,x1:2,x2:-1};
function txt(k){return S[lang][k]}function n(id){return Number($(id).value||0)}function fmt(x){if(Math.abs(x)<1e-10)x=0;const r=Math.round(x*100)/100;return Number.isInteger(r)?String(r):String(r)}function M(a,b,c,d){return [[a,b],[c,d]]}function det(A){return A[0][0]*A[1][1]-A[0][1]*A[1][0]}function inv(A){const q=det(A);return [[A[1][1]/q,-A[0][1]/q],[-A[1][0]/q,A[0][0]/q]]}function mm(A,B){return A.map((r,i)=>B[0].map((_,j)=>r.reduce((s,__,k)=>s+A[i][k]*B[k][j],0)))}function mv(A,v){return A.map(r=>r[0]*v[0]+r[1]*v[1])}function vec(v){return `<span class="vec"><span>${fmt(v[0])}</span><span>${fmt(v[1])}</span></span>`}function matrix(el,A){el.innerHTML='';el.style.gridTemplateColumns='repeat(2,66px)';A.forEach(r=>r.forEach(x=>{const s=document.createElement('span');s.className='mc';s.textContent=fmt(x);el.appendChild(s)}))}
function render(){const T=M(n('t11'),n('t12'),n('t21'),n('t22')),U=M(n('u11'),n('u21'),n('u12'),n('u22')),V=M(n('v11'),n('v21'),n('v12'),n('v22')),x=[n('x1'),n('x2')];['k','title','sub','lt','lu','lv','lx','q','da','db','dc','dci','note','uses','preset','reset'].forEach(id=>$(id).textContent=txt(id));$('back').textContent=txt('back');$('back').href=`../index.html?lang=${lang}`;$('l381').textContent=txt('l381');$('l381').href=`../3-81/index.html?lang=${lang}`;$('l382').textContent=txt('l382');$('l382').href=`../3-82/index.html?lang=${lang}`;$('en').classList.toggle('active',lang==='en');$('ru').classList.toggle('active',lang==='ru');document.documentElement.lang=lang;const ok=Math.abs(det(U))>1e-7&&Math.abs(det(V))>1e-7;$('warn').textContent=ok?'':txt('warn');if(!ok){['A','B','C','Ci'].forEach(id=>$(id).innerHTML='—');['n1','n2','n3','n4','dn1','dn2'].forEach(id=>$(id).textContent='—');return}const Ui=inv(U),Vi=inv(V),A=mm(mm(Ui,T),U),B=mm(mm(Vi,T),V),C=mm(Vi,U),Ci=mm(Ui,V);const xv=mv(C,x),txv=mv(B,xv),txu=mv(Ci,txv),direct=mv(A,x);matrix($('A'),A);matrix($('B'),B);matrix($('C'),C);matrix($('Ci'),Ci);$('n1').innerHTML=vec(x);$('n2').innerHTML=vec(xv);$('n3').innerHTML=vec(txv);$('n4').innerHTML=vec(txu);$('dn1').innerHTML=vec(x);$('dn2').innerHTML=vec(direct);$('s1').textContent=txt('s1');$('s2').textContent=txt('s2');$('s3').textContent=txt('s3');$('s4').textContent=txt('s4')}
function detect(){const q=new URLSearchParams(location.search).get('lang');if(q==='ru'||q==='en')lang=q;else if(navigator.language.toLowerCase().startsWith('ru'))lang='ru'}function reset(){Object.entries(defaults).forEach(([k,v])=>$(k).value=v);presetN=0;render()}function preset(){presetN=(presetN+1)%3;const sets=[[[1,1],[-1,1]],[[2,-1],[1,1]],[[1,2],[1,-1]]],s=sets[presetN];$('v11').value=s[0][0];$('v21').value=s[0][1];$('v12').value=s[1][0];$('v22').value=s[1][1];render()}
['t11','t12','t21','t22','u11','u21','u12','u22','v11','v21','v12','v22','x1','x2'].forEach(id=>$(id).oninput=render);$('en').onclick=()=>{lang='en';render()};$('ru').onclick=()=>{lang='ru';render()};$('reset').onclick=reset;$('preset').onclick=preset;detect();reset();
</script>
</body></html>
